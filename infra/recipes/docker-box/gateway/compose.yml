# Gateway compose project on the Docker box. Started by start.sh, never by hand, because start.sh
# writes the env files from SSM first. The master key reaches only the litellm container (D36).
name: gateway

services:
  caddy:
    build:
      context: .
      dockerfile: caddy.Dockerfile
    image: xenia-caddy:local
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ZONE: ${ZONE:?ZONE comes from /etc/xenia.env}
      APP_PORT: ${APP_PORT:-3000}
      AWS_REGION: ca-central-1
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      backend:
        # Both keys are set because they fix different things and neither alone is reliable here:
        # `priority` is Compose's own connection-order hint (which network Compose attaches first);
        # it does NOT control the container's default route on its own. `gw_priority` is what
        # actually pins the default gateway, but it needs Docker Engine >= 28 (API 1.48) — the box
        # installs AL2023's unpinned `docker` package (dnf install docker), which was confirmed on
        # the real box to be Engine 25.0.16, so `gw_priority` is ignored there.
        #
        # On Engine 25, a multi-network container's default route is NOT decided by connection
        # order (so `priority` doesn't help either): it's picked from whichever attached network's
        # NAME sorts first lexicographically (confirmed on the box: an `aaa-test` network won
        # regardless of attach order). `edge` sorts before `gateway`, so with that name Caddy always
        # routed via `edge0` and the IMDS guard dropped its DNS-01/instance-role traffic. The Docker
        # network here is named `backend` instead (Caddy, LiteLLM, Postgres) specifically because
        # `backend` < `edge` lexically, so Engine 25 picks it; `gw_priority` then also does the
        # right thing outright once the box is ever upgraded to Engine 28+. The bridge name stays
        # `gw0` (the DOCKER-USER IMDS guard rule keys off that, not the network's Docker-assigned
        # name), and the compose *project* stays named `gateway` (container names, the SSM document,
        # etc. are unaffected) — only this Docker network was renamed.
        # start.sh asserts the actual route after `up` and dies loudly if this ever picks `edge`
        # instead (the IMDS guard would then drop Caddy's instance-role traffic and DNS-01 fails).
        priority: 100
        gw_priority: 100
      edge: {}

  litellm:
    image: ghcr.io/berriai/litellm:v1.102.1@sha256:87f34979b9f8cb274fac90ca8a4fdda07d8480de22755562a26adeb95ce20d02
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    env_file:
      - /run/xenia/litellm.env
    environment:
      AWS_REGION: us-east-1
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
      - /run/xenia/certs:/certs:ro
    # Loopback only: scripts/gateway-key.sh reaches the key API through an SSM port-forward.
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  postgres:
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    restart: unless-stopped
    env_file:
      - /run/xenia/postgres.env
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

networks:
  backend:
    external: true
  edge:
    external: true

volumes:
  caddy-data: {}
  caddy-config: {}
  pgdata: {}
