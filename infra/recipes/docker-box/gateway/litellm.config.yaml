# LiteLLM gateway (spec section 10). Nothing secret lives here: start.sh writes /run/xenia/litellm.env
# from SSM, and os.environ/NAME reads from it.
model_list:
  - model_name: qwen3-coder
    litellm_params:
      model: hosted_vllm/qwen3-coder
      api_base: os.environ/VLLM_API_BASE
      api_key: os.environ/VLLM_API_KEY
      # A stopped GPU box drops packets rather than refusing the connection, so a long timeout here
      # would eat into Claude Code's 300s silent-stream watchdog before failover to Bedrock ever
      # fires. 90s lets the fallback happen well inside that budget.
      timeout: 90
      stream_timeout: 90
    model_info:
      id: qwen3-coder-vllm
      max_input_tokens: 131072
      max_output_tokens: 16000
      supports_function_calling: true
  - model_name: qwen3-coder-bedrock
    litellm_params:
      model: bedrock/converse/qwen.qwen3-coder-30b-a3b-v1:0
      aws_region_name: us-east-1
      timeout: 600
      max_budget: 25
      budget_duration: 7d
    model_info:
      id: qwen3-coder-bedrock
      max_input_tokens: 131072
      max_output_tokens: 16000
      supports_function_calling: true

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  allowed_fails: 1
  cooldown_time: 120
  # This LiteLLM version looks fallbacks up under the name the client asked for, not the model group an
  # alias resolves to, so every model_group_alias key below needs its own entry here or requests by
  # that name never fail over to Bedrock while the GPU box is down (tests/litellm-config.bats checks).
  fallbacks:
    - qwen3-coder: [qwen3-coder-bedrock]
    - opus: [qwen3-coder-bedrock]
    - sonnet: [qwen3-coder-bedrock]
    - haiku: [qwen3-coder-bedrock]
    - fable: [qwen3-coder-bedrock]
    - claude-fable-5-1: [qwen3-coder-bedrock]
    - claude-opus-5-5: [qwen3-coder-bedrock]
    - claude-sonnet-5: [qwen3-coder-bedrock]
    - claude-haiku-4-5: [qwen3-coder-bedrock]
    - claude-haiku-4-5-20251001: [qwen3-coder-bedrock]
    - claude-opus-4-1: [qwen3-coder-bedrock]
    - claude-sonnet-4-5: [qwen3-coder-bedrock]
    - claude-3-5-haiku-latest: [qwen3-coder-bedrock]
  # Claude Code asks for Claude model names; every one of them is the team coder. Remapping haiku to
  # another model later is one line. This pinned LiteLLM version's wildcard model_list support is for
  # provider-prefixed patterns (e.g. "anthropic/*") that pass the suffix through as the real model id
  # to call; it isn't a generic "any claude-* alias" match, so any new Claude model ID Claude Code
  # starts sending needs a line added here rather than a single catch-all.
  model_group_alias:
    opus: qwen3-coder
    sonnet: qwen3-coder
    haiku: qwen3-coder
    fable: qwen3-coder
    claude-fable-5-1: qwen3-coder
    claude-opus-5-5: qwen3-coder
    claude-sonnet-5: qwen3-coder
    claude-haiku-4-5: qwen3-coder
    claude-haiku-4-5-20251001: qwen3-coder
    claude-opus-4-1: qwen3-coder
    claude-sonnet-4-5: qwen3-coder
    claude-3-5-haiku-latest: qwen3-coder

litellm_settings:
  # Anthropic-only fields (thinking, cache_control, betas) are dropped, not rejected.
  drop_params: true
  request_timeout: 600
  json_logs: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  background_health_checks: true
  # Background health checks poll every deployment on this cadence; 30s was too chatty against a
  # possibly-stopped GPU box, so this is slowed to 300s (controller ruling, pre-flight 7.4).
  health_check_interval: 300
