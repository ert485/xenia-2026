# check: the first of the two blocking gates (P-two-gates). Runs make check, identical to local.
name: check
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (default rules plus the LiteLLM sk- rule)
        # gitleaks/gitleaks-action refuses to run on org repos without a paid licence, and every
        # team repo is an org repo. Run the CLI directly instead, scanning only the new commits.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"  # v8.30.1
          if [ "$EVENT_NAME" = "pull_request" ]; then
            log_opts="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [ -n "$PUSH_BEFORE_SHA" ] && [ "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            log_opts="$PUSH_BEFORE_SHA..$PUSH_SHA"
          else
            log_opts=""
          fi
          args=(detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner)
          if [ -n "$log_opts" ]; then
            args+=("--log-opts=$log_opts")
          fi
          docker run --rm \
            -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$image" "${args[@]}"
      - name: make check
        run: make check

  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: fetch the kit's verifier (team repos don't vendor it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ert485/xenia-2026
          ref: ${{ vars.KIT_REF || 'main' }}
          path: .kit
          persist-credentials: false
      - name: resolve the base commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then base="$PR_BASE_SHA"; else base="$PUSH_BASE_SHA"; fi
          echo "BASE=$base" >> "$GITHUB_ENV"
      - name: agent-verify
        env:
          BASE: ${{ env.BASE }}
          # Team repos own their root layout, so a new root file warns instead of blocking; see
          # templates/devcontainer/devcontainer.json's XENIA_VERIFY_ARGS for the matching Stop
          # hook setting in team Claude sessions.
          VERIFY_EXTRA_ARGS: "--warn root-files"
          # A team PR could add its own executable scripts/ci/verify-pr.sh; select the kit's own
          # checkout by repository identity, not by whether that file happens to exist here.
          IS_KIT_REPO: ${{ github.repository == 'ert485/xenia-2026' }}
        run: |
          if [ "$IS_KIT_REPO" = "true" ]; then kit=.; else kit=.kit; fi
          "$kit/scripts/ci/verify-pr.sh" "$BASE"
