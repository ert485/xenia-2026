# render-shutdown-md: fails a PR whose SHUTDOWN.md no longer matches the shutdown.d headers.
name: render-shutdown-md
on:
  pull_request:
    paths:
      - "shutdown.d/**"
      - "SHUTDOWN.md"
      - "scripts/render-shutdown-md.sh"
      - "plugin/scripts/render-shutdown-md.sh"
permissions: {}
jobs:
  render-shutdown-md:
    name: render-shutdown-md
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fetch the kit's renderer (team repos don't vendor it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ert485/xenia-2026
          ref: ${{ vars.KIT_REF || 'main' }}
          path: .kit
          persist-credentials: false
      - name: SHUTDOWN.md is current
        env:
          # A team PR could add its own executable scripts/render-shutdown-md.sh; select the
          # kit's own checkout by repository identity, not by whether that file happens to exist.
          IS_KIT_REPO: ${{ github.repository == 'ert485/xenia-2026' }}
        run: |
          if [ "$IS_KIT_REPO" = "true" ]; then kit=.; else kit=.kit; fi
          if ! "$kit/scripts/render-shutdown-md.sh" shutdown.d | diff -u SHUTDOWN.md -; then
            echo "::error::SHUTDOWN.md is stale: run make shutdown-md and commit (in a team repo: plugin/scripts/render-shutdown-md.sh shutdown.d > SHUTDOWN.md)"
            exit 1
          fi
