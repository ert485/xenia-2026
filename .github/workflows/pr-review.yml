# pr-review: the bot's advisory review (spec section 12). Never blocks a merge: only make check and
# shutdown coverage do (P-two-gates). Three jobs, so the agent that reads PR content holds no write
# token and the job holding the write token never runs PR code.
#
# Task 33 adds a second, deeper pass (deep-decide, deep-review, deep-comment) that reruns the same
# bot with a wider brief and, unlike the quick review, lets it use Bash: it needs to actually run
# `make check` and focused tests to report whether they ran, not just read about them. That job
# still runs PR code with no write token (contents: read only, same as the quick review's agent
# job), no cloud credentials, is skipped for fork PRs (same fork-skip guard as the quick review),
# and its only secret is the same budget-capped gateway key the quick review already uses.
name: pr-review
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
permissions: {}
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  REVIEW_PROMPT: templates/review/review-prompt.md
  REVIEW_MAX_TURNS: 40
  DEEP_REVIEW_PROMPT: templates/review/deep-review-prompt.md
  DEEP_REVIEW_MAX_TURNS: 120
  DEEP_REVIEW_SAMPLE: ${{ vars.DEEP_REVIEW_SAMPLE }}
jobs:
  check:
    name: review-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: pick the mode
        id: mode
        env:
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          HAS_REVIEW_LABEL: ${{ contains(toJSON(github.event.pull_request.labels.*.name), '"review"') }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if [ "$ACTION" = labeled ] && [ "$ADDED_LABEL" != review ]; then
            mode=skip
          elif printf '%s\n' "$changed" | grep -qE '(^|/)PRINCIPLES(-EXTENDED)?\.md$'; then
            mode=consistency
          elif [ "$HAS_REVIEW_LABEL" = true ] || [ "$ACTION" = ready_for_review ]; then
            mode=review
          else
            mode=skip
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "pr-review mode: $mode"
      - name: make check and the diff (no secrets in this job)
        # Always runs, even when mode is skip: the deep review (Task 33) can trigger on its own
        # sampling/risky-path/label rules regardless of the quick review's mode, and both reviews
        # read this same review-inputs artifact.
        run: |
          set +e
          make check > check-output.txt 2>&1
          echo "make check exit code: $?" >> check-output.txt
          git diff "$BASE_SHA...$HEAD_SHA" > diff.patch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-inputs
          path: |
            check-output.txt
            diff.patch
          retention-days: 3

  review:
    name: review
    needs: check
    if: needs.check.outputs.mode != 'skip' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: fetch the reviewer prompts from the kit's main (never from the PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ert485/xenia-2026
          ref: main
          path: .kit
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-inputs
          path: .review
      - name: install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.280
      - name: run the bot with read-only tools
        env:
          ANTHROPIC_BASE_URL: https://llm.26.cohack.tetl.ca
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.GATEWAY_CI_KEY }}
          ANTHROPIC_MODEL: qwen3-coder
          ANTHROPIC_DEFAULT_OPUS_MODEL: qwen3-coder
          ANTHROPIC_DEFAULT_SONNET_MODEL: qwen3-coder
          ANTHROPIC_DEFAULT_HAIKU_MODEL: qwen3-coder
          ANTHROPIC_DEFAULT_FABLE_MODEL: qwen3-coder
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: "110000"
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: "16000"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          MODE: ${{ needs.check.outputs.mode }}
          REVIEW_PROMPT: ${{ env.REVIEW_PROMPT }}
          REVIEW_MAX_TURNS: ${{ env.REVIEW_MAX_TURNS }}
        run: |
          case "$MODE" in
            consistency) prompt=.kit/templates/review/consistency-prompt.md ;;
            *) prompt=".kit/$REVIEW_PROMPT" ;;
          esac
          set +e
          claude -p "$(cat "$prompt")" \
            --allowedTools "Read,Grep,Glob" \
            --disallowedTools "Bash,Edit,Write,MultiEdit,NotebookEdit,WebFetch,WebSearch,Task" \
            --max-turns "$REVIEW_MAX_TURNS" --output-format json > review.json 2> claude.err
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || ! jq -e '.result | strings | length > 0' review.json > /dev/null 2>&1; then
            echo "claude exited $rc; last lines of stderr:"
            tail -5 claude.err | sed -E 's/sk-[A-Za-z0-9_-]{20,}/sk-<redacted>/g'
            jq -n '{result: "Bot: the bot could not complete the review within its limits (turns, time, or the gateway). Teammate: remove and re-add the review label to try again."}' > review.json
          fi
          {
            echo '<!-- xenia-pr-review -->'
            # shellcheck disable=SC2016  # backticks here are literal markdown for make check, not command substitution
            echo 'Bot review (advisory; only `make check` and shutdown coverage block, P-two-gates).'
            if [ "$MODE" = consistency ]; then echo 'Mode: consistency (this PR changes the team rules).'; fi
            echo
            jq -r '.result' review.json | head -c 60000
          } | sed -E 's/sk-[A-Za-z0-9_-]{20,}/sk-<redacted>/g; s/[0-9]{12}/<account-id>/g' > review.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-comment
          path: review.md
          retention-days: 3

  comment:
    name: comment
    needs: review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-comment
      - name: post or update the bot's comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- xenia-pr-review -->")) | .id' | tail -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@review.md > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@review.md > /dev/null
          fi

  deep-decide:
    name: deep-decide
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
      LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: fetch the kit's scripts (team repos don't vendor them)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ert485/xenia-2026
          ref: main
          path: .kit
          persist-credentials: false
      - name: decide whether this PR gets the deep review
        id: decide
        env:
          SAMPLE: ${{ env.DEEP_REVIEW_SAMPLE }}
        run: |
          if [ -x scripts/ci/deep-review-trigger.sh ]; then kit=.; else kit=.kit; fi
          set +e
          out="$("$kit/scripts/ci/deep-review-trigger.sh" "$BASE_SHA" "$HEAD_SHA")"
          rc=$?
          set -e
          echo "deep-review-trigger: $out (exit $rc)"
          if [ "$rc" -ne 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            run="$(printf '%s' "$out" | sed -n 's/^run=\(true\|false\).*/\1/p')"
            echo "run=${run:-false}" >> "$GITHUB_OUTPUT"
          fi

  deep-review:
    name: deep-review
    needs: [check, deep-decide]
    if: needs.deep-decide.outputs.run == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: fetch the reviewer prompts from the kit's main (never from the PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ert485/xenia-2026
          ref: main
          path: .kit
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: review-inputs
          path: .review
      - name: fetch the quick review's comment, if any (public repo, no token needed)
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          comments="$(curl -sf "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" || echo '[]')"
          quick="$(printf '%s' "$comments" | jq -r '[.[] | select(.body | startswith("<!-- xenia-pr-review -->"))] | last | .body // empty')"
          if [ -n "$quick" ]; then
            printf '%s\n' "$quick" > .review/quick-review.md
          else
            echo "(the quick review has not posted a comment on this PR yet)" > .review/quick-review.md
          fi
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - name: install kit tools (same as the check workflow, so make check can actually run)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck bats python3-yaml
          pipx install zizmor
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz | tar xz actionlint
          sudo mv actionlint /usr/local/bin/actionlint
      - name: install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.280
      - name: run the bot with read tools and Bash
        env:
          ANTHROPIC_BASE_URL: https://llm.26.cohack.tetl.ca
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.GATEWAY_CI_KEY }}
          ANTHROPIC_MODEL: qwen3-coder
          ANTHROPIC_DEFAULT_OPUS_MODEL: qwen3-coder
          ANTHROPIC_DEFAULT_SONNET_MODEL: qwen3-coder
          ANTHROPIC_DEFAULT_HAIKU_MODEL: qwen3-coder
          ANTHROPIC_DEFAULT_FABLE_MODEL: qwen3-coder
          CLAUDE_CODE_MAX_CONTEXT_TOKENS: "110000"
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: "16000"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          DEEP_REVIEW_PROMPT: ${{ env.DEEP_REVIEW_PROMPT }}
          DEEP_REVIEW_MAX_TURNS: ${{ env.DEEP_REVIEW_MAX_TURNS }}
        run: |
          set +e
          claude -p "$(cat ".kit/$DEEP_REVIEW_PROMPT")" \
            --allowedTools "Read,Grep,Glob,Bash" \
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,WebFetch,WebSearch,Task" \
            --max-turns "$DEEP_REVIEW_MAX_TURNS" --output-format json > review.json 2> claude.err
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] || ! jq -e '.result | strings | length > 0' review.json > /dev/null 2>&1; then
            echo "claude exited $rc; last lines of stderr:"
            tail -5 claude.err | sed -E 's/sk-[A-Za-z0-9_-]{20,}/sk-<redacted>/g'
            jq -n '{result: "Bot: the deep review could not complete within its limits (turns, time, or the gateway)."}' > review.json
          fi
          {
            echo '<!-- xenia-deep-review -->'
            # shellcheck disable=SC2016  # backticks here are literal markdown for make check, not command substitution
            echo 'Bot deep review (advisory; only `make check` and shutdown coverage block, P-two-gates).'
            echo
            jq -r '.result' review.json | head -c 60000
          } | sed -E 's/sk-[A-Za-z0-9_-]{20,}/sk-<redacted>/g; s/[0-9]{12}/<account-id>/g' > deep-review.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-review-comment
          path: deep-review.md
          retention-days: 3

  deep-comment:
    name: deep-comment
    needs: deep-review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deep-review-comment
      - name: post or update the bot's deep-review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- xenia-deep-review -->")) | .id' | tail -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@deep-review.md > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@deep-review.md > /dev/null
          fi
